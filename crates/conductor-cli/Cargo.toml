[package]
name = "conductor-cli"
description = "Conductor command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "conductor"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
# `task run` builds an adapter and reads the repository, so the CLI now depends
# on the two crates that own those. Workspace members, not new third-party
# packages — nothing new enters the lock.
conductor-agent.workspace = true
conductor-core.workspace = true
conductor-git.workspace = true
conductor-run.workspace = true
conductor-store.workspace = true
# The store hands out `rusqlite::Connection`, and `task show` reads two tables
# S5 has no typed accessor for. Same version as conductor-store, so cargo
# unifies it.
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# §6.5's review decision is a YAML document `review export` writes and a human
# edits. Not a new package: `conductor-run` already depends on this exact
# version for the verification profile (§2.2 authorizes it), so nothing new
# enters the lock — the same argument the `rusqlite` line above makes.
serde_yaml = "0.9.34"

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"
