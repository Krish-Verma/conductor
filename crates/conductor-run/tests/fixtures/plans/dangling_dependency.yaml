# `valid.yaml` with one defect: T-0002 depends on T-0009, which no slice
# declares.
#
# §3.7 refuses dangling references. A dependency naming nothing is not an
# ordering constraint — it is a task that is `PENDING` until the heat death of
# the universe, because the dependency it waits on can never become `COMPLETE`.
plan:
  id: p-fixture
  version: 3
  objective: "A dependency names a task that does not exist."
  milestones:
    - id: M-01
      title: "Plan core"
      slices:
        - id: S-11
          title: "Plan ledger"
          tasks:
            - id: T-0001
              objective: "Model the plan document."
              depends_on: []
              scope:
                allowed_globs: ["crates/conductor-run/src/plan/**"]
                forbidden_globs: [".conductor/**"]
              verification_profile: default
              acceptance_criteria:
                - id: AC-1
                  statement: "The model deserialises the fixture plans."
                  verified_by: [unit-tests]
            - id: T-0002
              objective: "Validate the plan document."
              depends_on: [T-0009]
              scope:
                allowed_globs: ["crates/conductor-run/src/plan/**"]
                forbidden_globs: [".conductor/**"]
              verification_profile: default
              acceptance_criteria:
                - id: AC-1
                  statement: "Every refusal names the offending id."
                  verified_by: [unit-tests]
