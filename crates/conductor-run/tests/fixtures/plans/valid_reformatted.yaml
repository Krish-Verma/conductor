---
# `valid.yaml`, reformatted beyond recognition and semantically identical.
#
# §3.6: "Hash semantics, not bytes. […] Therefore reformatting does **not**
# invalidate approval; changing any field **does**." This file is the evidence
# for the first half. Every knob a YAML author can turn without changing what
# the document *means* is turned here:
#
#   * an explicit `---` document marker
#   * keys reordered inside every mapping
#   * four-space indentation instead of two
#   * flow style for the scope mappings and some sequences
#   * single quotes, double quotes and bare scalars mixed
#   * comments, including one on almost every line
#   * blank lines and trailing whitespace
#
# Sequence *order* is deliberately untouched: element order is content, not
# formatting, and the hash treats it that way (see `plan::hash`).
plan:

    version: 3   # ordered after nothing in particular

    milestones:
        -   slices:
                -   tasks:

                        -   acceptance_criteria:
                                - verified_by: ['unit-tests']
                                  statement: The model deserialises the fixture plans.
                                  id: "AC-1"
                            attempt_budget: 3
                            verification_profile: "default"
                            scope: {forbidden_globs: ['.conductor/**'], allowed_globs: ["crates/conductor-run/src/plan/**"]}
                            depends_on: []
                            rationale: 'Nothing downstream can be checked until the shape exists.'
                            objective: "Model the plan document."
                            id: T-0001

                        # The second task, written back-to-front.
                        -   id: 'T-0002'
                            depends_on: ["T-0001"]
                            acceptance_criteria:

                                -   id: AC-1
                                    statement: 'Every refusal names the offending id.'
                                    verified_by:
                                        - unit-tests
                                        - "typecheck"

                                -   verified_by: [no-secrets]
                                    id: AC-2
                                    statement: "No secret reaches the validation report."

                            attempt_budget: 3
                            scope:
                                allowed_globs:
                                    - 'crates/conductor-run/src/plan/**'
                                forbidden_globs: [".conductor/**"]
                            verification_profile: default
                            rationale: "An unbound criterion is how a task completes on an agent's word."
                            objective: 'Validate the plan document.'

                    title: 'Plan ledger'
                    id: "S-11"
            title: Plan core
            id: 'M-01'

    objective: 'Prove that the S11 plan core accepts a well-formed plan.'
    id: "p-fixture"
