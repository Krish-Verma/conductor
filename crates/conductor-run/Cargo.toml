[package]
name = "conductor-run"
description = "Conductor runtime: containment probing, agent supervision, leases and startup recovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
# The probe's payload: a binary with defined exit codes and a machine-readable
# result line, run under each (adapter × launcher) being measured. Deliberately
# not `/bin/sh` — a shell reports "denied" and "could not start" the same way.
name = "conductor-probe-action"
path = "src/bin/conductor-probe-action.rs"

[[bin]]
# The foreground worker (§2.4). A separate process because the crash matrix has
# to kill Conductor while the agent keeps running, and a supervisor that lived
# inside the test binary could not demonstrate that (§6.1).
name = "conductor-s3-worker"
path = "src/bin/conductor-s3-worker.rs"

[[bin]]
# S4's failure-injection payload. A verification runner that can be killed
# mid-check, and that can be given an `RLIMIT_FSIZE` without imposing it on
# every test sharing a process. See the binary's own module docs.
name = "conductor-s4-verifier"
path = "src/bin/conductor-s4-verifier.rs"

[[bin]]
# The S5 vertical as a separate process. The six integration kill points have to
# be injected into something that can actually die: a vertical living inside the
# test binary would take the assertions down with it. Same reason S3 needed
# `conductor-s3-worker` and S4 needed `conductor-s4-verifier`.
name = "conductor-s5-vertical"
path = "src/bin/conductor-s5-vertical.rs"

[[bin]]
# S8's kill-restart cycle. The slice's Verify line asks for approval state to
# survive 50 kill-restart cycles, and a "restart" that is really two `Store`
# handles in one process proves that `open_existing` works, not that anything is
# durable. A `SIGKILL` cannot be caught, so this process leaves the database in
# the state a power cut would. Same reason S3, S4 and S5 each needed their own
# binary.
name = "conductor-s8-approval-victim"
path = "src/bin/conductor-s8-approval-victim.rs"

[dependencies]
# §3.4's `Conductor-Verification` trailer is a blake3 digest over the
# evidence the completion gate read (ADR-0007: blake3 is the only digest).
# Already in the lock via conductor-core, so no new package enters the build.
blake3 = "1.8.6"
conductor-agent.workspace = true
conductor-core.workspace = true
conductor-git.workspace = true
conductor-store.workspace = true
# SIGTERM, kill(pid, 0) and proc_pidinfo. std offers no way to send a signal
# other than SIGKILL (`Child::kill`), no way to ask whether an arbitrary pid is
# alive, and no way to read a process start time — and §6.4 requires
# "SIGTERM, grace, SIGKILL" while §4.7 step 3 requires "alive **and** start-time
# matches". Already in Cargo.lock transitively, so no new package enters the
# build. `tokio` was considered and not taken: see the S3 completion report.
libc = "0.2.189"
# Same version as conductor-store, so cargo unifies it and no new package enters
# the lock. Needed because master plan S2.5 places the `containment_probe` cache
# in this crate, and the store hands out `rusqlite::Connection`.
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The verification profile (§4.5) is YAML, and §2.2 authorizes `serde_yaml` by
# name. S4 is the first slice that reads a YAML file, so it is added here.
# Known risk, recorded rather than discovered later: upstream archived this crate
# at 0.9.34 ("+deprecated"). It is still correct and has no unsafe code, and the
# only module that touches it is `verify::profile`, whose entire surface is one
# `from_str` — so a future swap is a one-file change. Taken because §2.2 names it
# and because inventing a different YAML crate would be the silent architecture
# change CLAUDE.md forbids.
serde_yaml = "0.9.34"
thiserror = "2.0.20"

[dev-dependencies]
libc = "0.2.189"
serde_json = "1.0.151"
tempfile = "3.27.0"
