[package]
name = "conductor-git"
description = "Per-run workspace isolation for Conductor: clone, descriptor, baseline, reconciliation, quarantine. Git is a subprocess, never a library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
conductor-core.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[dev-dependencies]
tempfile = "3.27.0"
